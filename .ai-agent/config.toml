hooks_enabled = false

# Auto-commit/push/PR after the agent finishes (only when there are changes)
[github]
enabled = true
auto_commit = true
auto_push = true
auto_pr = true
branch = "agent"
commit_message_template = "Agent: {user_message}"
pr_title_template = "Agent updates: {user_message}"
pr_body_template = "Automated changes from coding agent.\n\n**User request:** {user_message}\n\n**Agent summary:** {agent_response}"

[model]
name = "arcee-ai/trinity-large-preview:free"
temperature = 0
context_window = 16000
max_tokens = 1000